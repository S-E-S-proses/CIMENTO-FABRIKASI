async function open(raw){const k=await S.importKey('raw',raw,'AES-GCM',false,['decrypt']);const z=await S.decrypt({name:'AES-GCM',iv:ub(C.iv)},k,ub(C.d));

async function unwrap(pw){const base=await S.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
for(const e of C.keys){try{const w=await S.deriveKey({name:'PBKDF2',salt:ub(e.s),iterations:C.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
